
name: Build Phone Master APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhoneMaster_MobileBuild.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -o PhoneMaster_MobileBuild.zip -d source

      - name: Build APK
        run: gradle --no-daemon -p source/PhoneMaster assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMaster-debug-apk
          path: source/PhoneMaster/app/build/outputs/apk/debug/app-debug.apk
